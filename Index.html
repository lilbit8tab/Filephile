<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Filephile – Universal File Transformer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <style>
    :root {
      --bg: #0d1117;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --text: #e6edf3;
      --subtext: #9ba3b4;
      --accent: #3b82f6;
      --accent-dark: #1e3a8a;
      --radius: 14px;
      --blur: 18px;
    }

    body.light {
      --bg: #f3f4f6;
      --card: rgba(255, 255, 255, 0.9);
      --border: rgba(15, 23, 42, 0.12);
      --text: #111827;
      --subtext: #4b5563;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      line-height: 1.6;
      transition: background 0.25s, color 0.25s;
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
    }

    /* GITHUB BANNER */
    .gh-banner {
      max-width: 900px;
      margin: 0 auto 1rem;
      padding: 0.5rem 0.75rem;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(59,130,246,0.18), rgba(15,23,42,0.9));
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
      border: 1px solid var(--border);
    }

    .gh-banner span {
      opacity: 0.9;
    }

    .gh-badge {
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: rgba(15,23,42,0.7);
      color: #e5e7eb;
      font-size: 0.75rem;
    }

    body.light .gh-badge {
      background: rgba(255,255,255,0.9);
      color: #111827;
    }

    /* TOP CONTROLS */
    .top-controls {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .chip-btn {
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      padding: 0.35rem 0.8rem;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--subtext);
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .chip-btn span {
      font-size: 0.9rem;
    }

    /* LOGO HEADER */
    .logo-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .logo-mark {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.45);
      overflow: hidden;
      flex-shrink: 0;
    }

    .logo-mark svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .logo-text h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .logo-text .tagline {
      font-size: 1.05rem;
      color: var(--subtext);
      margin-top: 0.25rem;
    }

    /* DESCRIPTION */
    .description {
      text-align: center;
      max-width: 700px;
      margin: 1rem auto 2rem;
      color: var(--subtext);
      font-size: 1rem;
    }

    /* GLASS CARD */
    .card {
      background: var(--card);
      backdrop-filter: blur(var(--blur));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.25);
    }

    .card h2 {
      margin-bottom: 0.75rem;
      font-size: 1.2rem;
      color: var(--accent);
    }

    /* UPLOAD */
    .upload-area {
      border: 2px dashed var(--border);
      padding: 2rem;
      border-radius: var(--radius);
      text-align: center;
      cursor: pointer;
      color: var(--subtext);
      transition: 0.25s;
    }

    .upload-area:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .upload-area input {
      display: none;
    }

    .file-info {
      margin-top: 0.75rem;
      color: var(--subtext);
      font-size: 0.9rem;
    }

    .hidden {
      display: none !important;
    }

    /* SELECT */
    select {
      width: 100%;
      padding: 0.75rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #161b22;
      color: var(--text);
      font-size: 1rem;
    }

    body.light select {
      background: #ffffff;
    }

    /* BUTTON */
    .primary-btn {
      background: var(--accent);
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.25s;
      margin-top: 0.5rem;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .primary-btn:hover {
      background: #60a5fa;
    }

    .primary-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 0.5rem;
      color: var(--subtext);
      font-size: 0.9rem;
    }

    .note {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: var(--subtext);
    }

    /* HOW IT WORKS */
    .how-it-works {
      background: var(--card);
      padding: 1.5rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 2rem;
    }

    .how-it-works h2 {
      text-align: center;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .how-list {
      padding-left: 1.25rem;
      color: var(--subtext);
    }

    .how-list li {
      margin-bottom: 0.75rem;
    }

    .donate-box {
      margin-top: 2rem;
      padding
